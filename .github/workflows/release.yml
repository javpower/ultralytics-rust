# 三平台发布矩阵：推 tag（如 v0.1.0）自动构建
#   每平台产出 yolo-{win64,linux64,mac-arm64}.zip（yolo 启动器 + yolo_core 引擎）
# 引擎链接 libtorch 2.11.0：CI 内按平台下载对应包后构建（tch 0.24 硬配对）
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win64
            lt_zip: https://download.pytorch.org/libtorch/cu128/libtorch-win-shared-with-deps-2.11.0%2Bcu128.zip
          - os: ubuntu-latest
            name: linux64
            lt_zip: https://download.pytorch.org/libtorch/cu128/libtorch-shared-with-deps-2.11.0%2Bcu128.zip
          - os: macos-latest
            name: mac-arm64
            lt_zip: https://download.pytorch.org/libtorch/cpu/libtorch-macos-arm64-2.11.0.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Download libtorch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/lt" | Out-Null
          Invoke-WebRequest -Uri "${{ matrix.lt_zip }}" -OutFile "$env:GITHUB_WORKSPACE/lt/lt.zip"
          Expand-Archive -Path "$env:GITHUB_WORKSPACE/lt/lt.zip" -DestinationPath "$env:GITHUB_WORKSPACE/lt" -Force
          # 定位 libtorch 根：all.h 固定于 <root>/include/torch/csrc/api/include/torch/
          $allh = Get-ChildItem "$env:GITHUB_WORKSPACE/lt" -Recurse -File -Filter "all.h" |
            Where-Object { $_.FullName -like "*include/torch/csrc/api/include/torch/all.h" } |
            Select-Object -First 1
          if (-not $allh) { throw "libtorch root not found" }
          $root = $allh.DirectoryName -replace "include/torch/csrc/api/include/torch$", ""
          $root = $root.TrimEnd("\", "/")
          if (-not (Test-Path (Join-Path $root "include/torch/all.h"))) { throw "libtorch root verify failed: $root" }
          "LIBTORCH=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download libtorch (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/lt"
          curl -sL --retry 3 -o "$GITHUB_WORKSPACE/lt/lt.zip" "${{ matrix.lt_zip }}"
          if [ "${{ runner.os }}" = "Linux" ]; then
            unzip -q "$GITHUB_WORKSPACE/lt/lt.zip" -d "$GITHUB_WORKSPACE/lt"
          else
            tar -xf "$GITHUB_WORKSPACE/lt/lt.zip" -C "$GITHUB_WORKSPACE/lt"
          fi
          # 定位 libtorch 根：all.h 固定于 <root>/include/torch/csrc/api/include/torch/
          allh=$(find "$GITHUB_WORKSPACE/lt" -type f -path "*torch/csrc/api/include/torch/all.h" | head -1)
          [ -z "$allh" ] && { echo "libtorch root not found"; exit 1; }
          root=${allh%include/torch/csrc/api/include/torch/all.h}
          root=${root%/}
          [ -f "$root/include/torch/all.h" ] || { echo "libtorch root verify failed: $root"; exit 1; }
          echo "LIBTORCH=$root" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cargo build --release -p ul-launcher
          cargo build --release -p ultralytics-rust

      - name: Package
        shell: pwsh
        run: |
          $dist = "$env:GITHUB_WORKSPACE/dist/yolo-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $suffix = if ("${{ runner.os }}" -eq "Windows") { ".exe" } else { "" }
          Copy-Item "target/release/yolo.exe"      "$dist/yolo$suffix"
          Copy-Item "target/release/yolo_core.exe" "$dist/yolo_core$suffix"
          Compress-Archive -Path "$dist/*" -DestinationPath "${{ github.workspace }}/yolo-${{ matrix.name }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: yolo-${{ matrix.name }}
          path: yolo-${{ matrix.name }}.zip
