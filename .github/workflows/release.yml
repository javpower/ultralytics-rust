# 三平台发布矩阵：tag 推送（如 v0.1.0）后自动构建 6 个产物
#   yolo-launcher-{win,linux,mac}（启动器，小） + yolo-core-{win,linux,mac}（引擎）
# 引擎链接 libtorch：CI 内按平台下载 2.11.0 运行时包后构建
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win64
            lt_url: https://download.pytorch.org/libtorch/cu128/libtorch-win-shared-with-deps-2.11.0%2Bcu128.zip
            lt_dir: libtorch-win-shared-with-deps-2.11.0+cu128
            exe: ""
          - os: ubuntu-latest
            name: linux64
            lt_url: https://download.pytorch.org/libtorch/cu128/libtorch-cu128-2.11.0%2Bcu128.zip
            lt_dir: libtorch-cu128-2.11.0+cu128
            exe: ""
          - os: macos-latest
            name: mac-arm64
            lt_url: https://download.pytorch.org/libtorch/cpu/libtorch-macos-arm64-2.11.0.zip
            lt_dir: libtorch
            exe: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # libtorch 2.11.0 运行时下载解压（tch 0.24 硬配对）
      - name: Download libtorch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/libtorch-dl" | Out-Null
          Invoke-WebRequest -Uri "${{ matrix.lt_url }}" -OutFile "$env:GITHUB_WORKSPACE/libtorch-dl/lt.zip"
          if ("${{ runner.os }}" -eq "Windows") {
            Expand-Archive -Path "$env:GITHUB_WORKSPACE/libtorch-dl/lt.zip" -DestinationPath "$env:GITHUB_WORKSPACE/libtorch-dl" -Force
          } else {
            tar -xf "$env:GITHUB_WORKSPACE/libtorch-dl/lt.zip" -C "$env:GITHUB_WORKSPACE/libtorch-dl"
          }

      - name: Build launcher + engine
        shell: pwsh
        run: |
          $lt = "$env:GITHUB_WORKSPACE/libtorch-dl/${{ matrix.lt_dir }}"
          $env:LIBTORCH = $lt
          $env:PATH = "$lt/bin;" + $env:PATH
          cargo build --release -p ul-launcher
          cargo build --release -p ultralytics-rust

      - name: Package
        shell: pwsh
        run: |
          $dist = "$env:GITHUB_WORKSPACE/dist/yolo-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $suffix = if ("${{ runner.os }}" -eq "Windows") { ".exe" } else { "" }
          Copy-Item "target/release/yolo.exe"      "$dist/yolo$suffix"
          Copy-Item "target/release/yolo_core.exe" "$dist/yolo_core$suffix"
          Compress-Archive -Path $dist/* -DestinationPath "$env:GITHUB_WORKSPACE/yolo-${{ matrix.name }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: yolo-${{ matrix.name }}
          path: yolo-${{ matrix.name }}.zip
