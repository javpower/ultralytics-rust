[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["ultralytics-rust contributors"]
description = "A complete Rust reimplementation of Ultralytics YOLO: training, validation, prediction and export for the full YOLO family (v3/v5/v6/v8/v9/v10/v11/v12/v26)."

[workspace.dependencies]
ul-core = { path = "crates/ul-core", version = "0.1.0" }
ul-nn = { path = "crates/ul-nn", version = "0.1.0" }
ul-data = { path = "crates/ul-data", version = "0.1.0" }
ul-engine = { path = "crates/ul-engine", version = "0.1.0" }

# ---- 深度学习底座：tch 硬绑定 libtorch 2.11（与官方 PyTorch 同一 C++ 运行时）----
# 本机已配对 libtorch-cu128-2.11（RTX 5060 Ti 实测通过），设 LIBTORCH 环境变量即可。
tch = "=0.24.0"
ndarray = "0.16"

# ---- 序列化 ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# ---- 数据与并行 ----
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
rayon = "1.10"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
memmap2 = "0.9"

# ---- 其他 ----
rand = "0.8"
regex = "1"
thiserror = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
num_cpus = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
